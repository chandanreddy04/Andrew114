name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reached
          POSTGRES_PASSWORD: reached
          POSTGRES_DB: reached_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reached" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Migrations apply (empty database)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://reached:reached@localhost:5432/reached_test
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://reached:reached@localhost:5432/reached_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx expo lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t reached-api backend
      - name: Start the full stack and check health
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && break
            sleep 2
          done
          curl -fsS localhost:8000/health | grep '"status":"ok"'
          docker compose exec -T worker celery -A app.tasks inspect ping
      - name: Logs
        if: always()
        run: docker compose logs --tail 50
